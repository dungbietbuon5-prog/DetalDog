name: Build Unsigned IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Auto-detect Project/Workspace and Scheme
        id: detect
        run: |
          echo "Finding workspace or project..."
          if ls *.xcworkspace >/dev/null 2>&1; then
            echo "TARGET_TYPE=workspace" >> $GITHUB_OUTPUT
            echo "TARGET_NAME=$(basename *.xcworkspace)" >> $GITHUB_OUTPUT
          elif ls *.xcodeproj >/dev/null 2>&1; then
            echo "TARGET_TYPE=project" >> $GITHUB_OUTPUT
            echo "TARGET_NAME=$(basename *.xcodeproj)" >> $GITHUB_OUTPUT
          else
            echo "Không tìm thấy file .xcodeproj hoặc .xcworkspace trong thư mục gốc!"
            exit 1
          fi
          
          # Lấy tên Scheme (thường trùng tên project)
          SCHEME_NAME=$(basename ${{ steps.detect.outputs.TARGET_NAME }} .xcodeproj)
          SCHEME_NAME=$(basename $SCHEME_NAME .xcworkspace)
          echo "SCHEME_NAME=$SCHEME_NAME" >> $GITHUB_OUTPUT

      - name: Build and Archive App
        run: |
          TARGET_FLAG="-${{ steps.detect.outputs.TARGET_TYPE }}"
          TARGET_FILE="${{ steps.detect.outputs.TARGET_NAME }}"
          
          echo "Đang build $TARGET_FLAG $TARGET_FILE với scheme ${{ steps.detect.outputs.SCHEME_NAME }}"
          
          xcodebuild clean archive \
            $TARGET_FLAG "$TARGET_FILE" \
            -scheme "${{ steps.detect.outputs.SCHEME_NAME }}" \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $PWD/build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Package to IPA
        run: |
          mkdir -p $PWD/build/Payload
          cp -r $PWD/build/App.xcarchive/Products/Applications/*.app $PWD/build/Payload/
          cd $PWD/build
          zip -r DetailDog-Unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Unsigned-IPA
          path: $PWD/build/DetailDog-Unsigned.ipa
          retention-days: 7
