name: Build Raw Dylib

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer

      - name: Install Theos
        run: |
          export THEOS=$HOME/theos
          mkdir -p $THEOS
          git clone --recursive https://github.com/theos/theos.git $THEOS
          curl -L https://github.com/theos/sdks/archive/master.zip -o sdks.zip
          unzip sdks.zip -d $THEOS/sdks
          mv $THEOS/sdks/sdks-master/* $THEOS/sdks/
          rm -rf $THEOS/sdks/sdks-master sdks.zip
          curl -L https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_macosx_x86_64 -o $THEOS/bin/ldid
          chmod +x $THEOS/bin/ldid

      - name: Compile Tweak (Dylib Only)
        run: |
          export THEOS=$HOME/theos
          export PATH=$THEOS/bin:$PATH
          
          # Tạo Makefile
          echo "ARCHS = arm64 arm64e" > Makefile
          echo "TARGET = iphone:clang:latest:15.0" >> Makefile
          echo "include \$(THEOS)/makefiles/common.mk" >> Makefile
          echo "TWEAK_NAME = TrungDungFF" >> Makefile
          echo "TrungDungFF_FILES = Tweak.xm" >> Makefile
          echo "TrungDungFF_FRAMEWORKS = UIKit Foundation" >> Makefile
          echo "TrungDungFF_CFLAGS = -Wno-error -Wno-deprecated-declarations" >> Makefile
          echo "include \$(THEOS_MAKE_PATH)/tweak.mk" >> Makefile

          # Chạy build (chỉ lấy dylib, không đóng gói deb)
          make package FINALPACKAGE=1

      - name: Merge Dylibs (Fat Binary)
        run: |
          # Gộp file arm64 và arm64e thành 1 file duy nhất (Fat Binary)
          lipo -create \
            .theos/obj/arm64/TrungDungFF.dylib \
            .theos/obj/arm64e/TrungDungFF.dylib \
            -output $PWD/TrungDungFF-Final.dylib

      - name: Upload Final Dylib
        uses: actions/upload-artifact@v4
        with:
          name: Final-Dylib
          path: TrungDungFF-Final.dylib
          retention-days: 7
