name: Build ThreeOneOSFive IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build and Package iOS App
    runs-on: macos-latest

    steps:
      - name: Checkout Repository with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Auto Extract Zip Archives and Clean macOS Junk
        run: |
          for zipfile in *.zip; do
            if [ -f "$zipfile" ]; then
              unzip -q "$zipfile"
            fi
          done

          rm -rf __MACOSX
          find . -name "._*" -delete

      - name: Build Archive and Generate IPA
        run: |
          PROJECT_PATH=""
          for p in $(find . -name "*.xcodeproj"); do
            if [[ "$p" != */_* ]] && [ -d "$p" ] && [ -f "$p/project.pbxproj" ]; then
              PROJECT_PATH="$p"
              break
            fi
          done
          
          if [ -z "$PROJECT_PATH" ]; then
            echo "Loi: Khong tim thay file Xcode project hop le!"
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$PROJECT_PATH")
          cd "$PROJECT_DIR"
          PROJECT_FILE=$(basename "$PROJECT_PATH")
          PROJECT_NAME=$(basename "$PROJECT_PATH" .xcodeproj)
          
          echo "Da vao thu muc: $(pwd)"
          
          # TU DONG TIM TEN SCHEME CHUAN TRONG PROJECT
          SCHEME_NAME=$(xcodebuild -list | sed -n '/Schemes:/,$p' | tail -n +2 | head -n 1 | xargs)
          if [ -z "$SCHEME_NAME" ]; then
            SCHEME_NAME="$PROJECT_NAME"
          fi
          echo "Phat hien Scheme su dung: $SCHEME_NAME"
          
          mkdir -p build/Payload
          
          xcodebuild -project "$PROJECT_FILE" \
                     -scheme "$SCHEME_NAME" \
                     -configuration Release \
                     -derivedDataPath build/DerivedData \
                     archive -archivePath build/"$PROJECT_NAME".xcarchive \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO

          APP_PATH="build/$PROJECT_NAME.xcarchive/Products/Applications/"
          
          # Tim file .app bat ky duoc sinh ra sau khi build
          REAL_APP=$(find build/DerivedData -name "*.app" | head -n 1)
          if [ -z "$REAL_APP" ]; then
            REAL_APP=$(find build -name "*.app" | head -n 1)
          fi

          if [ -d "$REAL_APP" ]; then
            cp -r "$REAL_APP" build/Payload/
            cd build
            # Lay ten file app that de dat ten file ipa
            APP_BASENAME=$(basename "$REAL_APP" .app)
            zip -r "$APP_BASENAME.ipa" Payload
            echo "Tao thanh cong file IPA: $APP_BASENAME.ipa!"
          else
            echo "Loi: Khong tim thay file .app sau khi build!"
            exit 1
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThreeOneOSFive-IPA
          path: '**/build/*.ipa'
          retention-days: 7
