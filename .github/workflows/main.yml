name: Build ThreeOneOSFive IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build and Package iOS App
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Debug Directory Structure
        run: |
          echo "=== DANH SACH CAC FILE TRONG REPO ==="
          find . -maxdepth 3 -not -path '*/.*'

      - name: Build Archive and Generate IPA
        run: |
          PROJECT_PATH=$(find . -name "*.xcodeproj" | head -n 1)
          
          if [ -z "$PROJECT_PATH" ]; then
            echo "Loi: Khong tim thay file Xcode project (.xcodeproj) nao trong repo!"
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$PROJECT_PATH")
          cd "$PROJECT_DIR"
          PROJECT_FILE=$(basename "$PROJECT_PATH")
          PROJECT_NAME=$(basename "$PROJECT_PATH" .xcodeproj)
          
          echo "Da tim thay project: $PROJECT_NAME (file: $PROJECT_FILE) tai thu muc: $(pwd)"
          
          mkdir -p build/Payload
          
          xcodebuild -project "$PROJECT_FILE" \
                     -scheme "$PROJECT_NAME" \
                     -configuration Release \
                     -derivedDataPath build/DerivedData \
                     archive -archivePath build/"$PROJECT_NAME".xcarchive \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO

          echo "Dang dong goi file .ipa..."
          APP_PATH="build/$PROJECT_NAME.xcarchive/Products/Applications/$PROJECT_NAME.app"
          
          if [ ! -d "$APP_PATH" ]; then
            APP_PATH=$(find build/DerivedData -name "*.app" | head -n 1)
          fi

          if [ -d "$APP_PATH" ]; then
            cp -r "$APP_PATH" build/Payload/
            cd build
            zip -r "$PROJECT_NAME.ipa" Payload
            echo "Da tao thanh cong file IPA!"
          else
            echo "Loi: Khong tim thay file .app sau khi build!"
            exit 1
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThreeOneOSFive-IPA
          path: '**/build/*.ipa'
          retention-days: 7
