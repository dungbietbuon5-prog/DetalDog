name: Build ThreeOneOSFive IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build and Package iOS App
    runs-on: macos-latest

    steps:
      - name: Checkout Repository with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Auto Extract Zip Archives and Clean macOS Junk
        run: |
          echo "=== DANG GIAI NEN VA DON DEP FILE RAC MACOS ==="
          
          # Giai nen neu co file zip
          for zipfile in *.zip; do
            if [ -f "$zipfile" ]; then
              echo "Phat hien file nen: $zipfile, dang giai nen..."
              unzip -q "$zipfile"
            fi
          done

          # Xoa bo hoan toan thu mục rác __MACOSX va cac file ẩn bat dau bang ._
          rm -rf __MACOSX
          find . -name "._*" -delete

          echo "=== DANH SACH SAU KHI DON DEP ==="
          find . -maxdepth 3 -not -path '*/.*'

      - name: Build Archive and Generate IPA
        run: |
          # Tim file .xcodeproj thuc su hop le (co chua project.pbxproj va khong phai file rac)
          PROJECT_PATH=""
          for p in $(find . -name "*.xcodeproj"); do
            if [[ "$p" != */._* ]] && [ -d "$p" ] && [ -f "$p/project.pbxproj" ]; then
              PROJECT_PATH="$p"
              break
            fi
          done
          
          if [ -z "$PROJECT_PATH" ]; then
            echo "Loi: Khong tìm thay file Xcode project (.xcodeproj) hop le nao!"
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$PROJECT_PATH")
          cd "$PROJECT_DIR"
          PROJECT_FILE=$(basename "$PROJECT_PATH")
          PROJECT_NAME=$(basename "$PROJECT_PATH" .xcodeproj)
          
          echo "Da tim thay project chuan: $PROJECT_NAME tai thu muc: $(pwd)"
          
          mkdir -p build/Payload
          
          xcodebuild -project "$PROJECT_FILE" \
                     -scheme "$PROJECT_NAME" \
                     -configuration Release \
                     -derivedDataPath build/DerivedData \
                     archive -archivePath build/"$PROJECT_NAME".xcarchive \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO

          APP_PATH="build/$PROJECT_NAME.xcarchive/Products/Applications/$PROJECT_NAME.app"
          
          if [ ! -d "$APP_PATH" ]; then
            APP_PATH=$(find build/DerivedData -name "*.app" | head -n 1)
          fi

          if [ -d "$APP_PATH" ]; then
            cp -r "$APP_PATH" build/Payload/
            cd build
            zip -r "$PROJECT_NAME.ipa" Payload
            echo "Tao thanh cong file IPA!"
          else
            echo "Loi: Khong tìm thay file .app sau khi build!"
            exit 1
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThreeOneOSFive-IPA
          path: '**/build/*.ipa'
          retention-days: 7
