name: Build 3105 IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip and Flatten Source Code
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            unzip -q "$ZIP_FILE"
            rm "$ZIP_FILE"
          fi
          
          rm -rf __MACOSX
          find . -name "._*" -delete
          
          # Chỉ di chuyển nội dung thư mục con ra ngoài (bỏ qua file ẩn của git)
          if [ -d "ProxyDetal-1.1.0" ]; then
            mv ProxyDetal-1.1.0/* . 2>/dev/null || true
            rm -rf ProxyDetal-1.1.0
          fi
          
          if [ -d "ThreeOneOSFive" ]; then
            mv ThreeOneOSFive/* . 2>/dev/null || true
            rm -rf ThreeOneOSFive
          fi

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate
          xcodebuild -resolvePackageDependencies -project ProxyDetal.xcodeproj

      - name: Build Archive
        run: |
          xcodebuild clean archive \
            -project ProxyDetal.xcodeproj \
            -scheme ProxyDetal \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $PWD/build/App.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="app.entitlements"

      - name: Package to IPA
        run: |
          mkdir -p $PWD/build/Payload
          cp -r $PWD/build/App.xcarchive/Products/Applications/*.app $PWD/build/Payload/
          
          APP_NAME=$(find $PWD/build/Payload -name "*.app" -exec basename {} \; | head -n 1)
          APP_PATH="$PWD/build/Payload/$APP_NAME"
          
          if [ -d "Patches" ]; then
            cp -r "Patches" "$APP_PATH/Patches"
          fi
          
          cd $PWD/build
          zip -r 3105-Unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3105-IPA
          path: $PWD/build/3105-Unsigned.ipa
          retention-days: 7
