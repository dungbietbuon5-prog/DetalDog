name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build and Package IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Archive
        run: |
          echo "Đang tiến hành build và tạo archive cho dự án..."
          # Nếu dự án nằm trong thư mục con, hãy thêm đường dẫn vào trước tên file .xcodeproj
          # Ví dụ: -project ten-thu-muc-con/ThreeOneOSFive.xcodeproj
          xcodebuild -project ThreeOneOSFive.xcodeproj \
                     -scheme ThreeOneOSFive \
                     -sdk iphoneos \
                     -configuration Release \
                     clean archive -archivePath build/ThreeOneOSFive.xcarchive

      - name: Export IPA
        run: |
          echo "Đang cấu hình ExportOptions và xuất file IPA..."
          mkdir -p build/ExportOptions
          
          cat << EOF > build/ExportOptions/ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>
              <key>compileBitcode</key>
              <false/>
              <key>uploadBitcode</key>
              <false/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
                     -archivePath build/ThreeOneOSFive.xcarchive \
                     -exportPath build/IPA \
                     -exportOptionsPlist build/ExportOptions/ExportOptions.plist

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThreeOneOSFive-IPA
          path: build/IPA/*.ipa
