name: Build ThreeOneOSFive IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build and Package iOS App
    runs-on: macos-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔨 Build Archive and Generate IPA
        run: |
          echo "Kiểm tra phiên bản Xcode trên hệ thống..."
          xcodebuild -version

          # Tự động chuyển vào thư mục chứa project nếu có (ví dụ: Detal-main)
          if [ -d "Detal-main" ]; then
            cd Detal-main
            echo "Đã chuyển vào thư mục: Detal-main"
          fi
          
          # Tạo thư mục chứa bản dựng
          mkdir -p build/Payload
          
          # Tiến hành build và archive (bỏ qua ký số để sideload)
          xcodebuild -project ThreeOneOSFive.xcodeproj \
                     -scheme ThreeOneOSFive \
                     -configuration Release \
                     -derivedDataPath build/DerivedData \
                     archive -archivePath build/ThreeOneOSFive.xcarchive \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO

          echo "Đang đóng gói file .ipa..."
          APP_PATH="build/ThreeOneOSFive.xcarchive/Products/Applications/ThreeOneOSFive.app"
          
          if [ ! -d "$APP_PATH" ]; then
            APP_PATH=$(find build/DerivedData -name "ThreeOneOSFive.app" | head -n 1)
          fi

          if [ -d "$APP_PATH" ]; then
            cp -r "$APP_PATH" build/Payload/
            cd build
            zip -r ThreeOneOSFive.ipa Payload
            echo "✅ Đã tạo thành công file IPA!"
          else
            echo "❌ Lỗi: Không tìm thấy file .app sau khi build!"
            exit 1
          fi

      - name: 📦 Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThreeOneOSFive-IPA
          path: '**/build/ThreeOneOSFive.ipa'
          retention-days: 7
