name: Build KGVN Dylib

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          export THEOS=$HOME/theos
          mkdir -p $THEOS
          git clone --recursive https://github.com/theos/theos.git $THEOS
          curl -L https://github.com/theos/sdks/archive/master.zip -o sdks.zip
          unzip sdks.zip -d $THEOS/sdks
          mv $THEOS/sdks/sdks-master/* $THEOS/sdks/
          rm -rf $THEOS/sdks/sdks-master sdks.zip
          curl -L https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_macosx_x86_64 -o $THEOS/bin/ldid
          chmod +x $THEOS/bin/ldid

      - name: Extract and Build
        run: |
          export THEOS=$HOME/theos
          export PATH=$THEOS/bin:$PATH
          
          # Giải nén file zip
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            unzip -q "$ZIP_FILE"
            rm "$ZIP_FILE"
          fi
          
          # Tìm thư mục chứa Makefile
          TARGET_DIR=$(find . -name "Makefile" -exec dirname {} \; | head -n 1)
          
          if [ -z "$TARGET_DIR" ]; then
            echo "LỖI: Không tìm thấy file Makefile!"
            exit 1
          fi
          
          echo "Đang build tại: $TARGET_DIR"
          cd "$TARGET_DIR"
          
          # Tiến hành build Tweak
          make package FINALPACKAGE=1

      - name: Upload Dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          # Lấy tất cả file .dylib được sinh ra trong quá trình build
          path: '**/.theos/obj/**/*.dylib'
          name: KGVN-Dylib
          retention-days: 7
