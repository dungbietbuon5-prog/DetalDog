name: Build 3105 IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip and Move to Root
        run: |
          # Tìm và giải nén file zip
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            unzip -q "$ZIP_FILE"
            rm "$ZIP_FILE"
          fi
          
          # Xóa file rác của Mac
          rm -rf __MACOSX
          find . -name "._*" -delete

          # Tự động tìm thư mục chứa file .xcodeproj và nhảy vào đó
          PROJECT_FILE=$(find . -name "*.xcodeproj" | head -n 1)
          if [ -z "$PROJECT_FILE" ]; then
            echo "LỖI: Không tìm thấy file .xcodeproj nào!"
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "Đã tìm thấy project tại: $PROJECT_DIR"
          
          # Di chuyển vào đúng thư mục chứa project
          cd "$PROJECT_DIR"

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer

      - name: Resolve Dependencies
        run: |
          PROJECT_FILE=$(find . -name "*.xcodeproj" | head -n 1)
          # Nếu có dùng SPM thì resolve, không thì thôi
          xcodebuild -resolvePackageDependencies -project "$PROJECT_FILE" || true

      - name: Build Archive
        run: |
          PROJECT_FILE=$(find . -name "*.xcodeproj" | head -n 1)
          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          cd "$PROJECT_DIR"
          
          PROJECT_NAME=$(basename "$PROJECT_FILE" .xcodeproj)
          
          # Build trực tiếp bằng file xcodeproj có sẵn của mày
          xcodebuild clean archive \
            -project "$PROJECT_FILE" \
            -scheme "$PROJECT_NAME" \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $PWD/../build/App.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="app.entitlements"

      - name: Package to IPA
        run: |
          mkdir -p $PWD/build/Payload
          cp -r $PWD/build/App.xcarchive/Products/Applications/*.app $PWD/build/Payload/
          
          APP_NAME=$(find $PWD/build/Payload -name "*.app" -exec basename {} \; | head -n 1)
          APP_PATH="$PWD/build/Payload/$APP_NAME"
          
          # Copy thư mục Patches vào bên trong app
          PATCHES_DIR=$(find . -type d -name "Patches" | head -n 1)
          if [ -n "$PATCHES_DIR" ]; then
            echo "Đang copy thư mục Patches từ $PATCHES_DIR..."
            cp -r "$PATCHES_DIR" "$APP_PATH/Patches"
          fi
          
          cd $PWD/build
          zip -r 3105-Unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3105-IPA
          path: $PWD/build/3105-Unsigned.ipa
          retention-days: 7
