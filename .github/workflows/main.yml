name: Build 3105 IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip Source Code
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            unzip -q "$ZIP_FILE"
            rm "$ZIP_FILE"
          fi
          rm -rf __MACOSX
          find . -name "._*" -delete

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Project and Build
        run: |
          # Tìm thư mục chứa file App.swift
          TARGET_DIR=$(find . -name "App.swift" -exec dirname {} \; | head -n 1)
          
          if [ -z "$TARGET_DIR" ]; then
            echo "LỖI: Không tìm thấy file App.swift ở đâu cả! Code của mày đâu?"
            exit 1
          fi
          
          echo "Đã tìm thấy code tại: $TARGET_DIR"
          cd "$TARGET_DIR"
          
          # Tạo một file project.yml tự động ngay tại thư mục này
          cat > project.yml << 'EOF'
          name: ProxyDetal
          options:
            bundleIdPrefix: com.proxydetal
            deploymentTarget:
              iOS: "15.0"
          packages:
            ZipArchive:
              url: https://github.com/ZipArchive/ZipArchive.git
              from: 2.5.0
          targets:
            ProxyDetal:
              type: application
              platform: iOS
              sources:
                - path: .
                  excludes:
                    - "Patches/**"
              dependencies:
                - package: ZipArchive
              settings:
                base:
                  INFOPLIST_FILE: Info.plist
                  PRODUCT_NAME: ProxyDetal
                  PRODUCT_BUNDLE_IDENTIFIER: com.proxydetal.app
                  GENERATE_INFOPLIST_FILE: NO
                  CODE_SIGN_ENTITLEMENTS: app.entitlements
                  CODE_SIGNING_ALLOWED: NO
                  CODE_SIGNING_REQUIRED: NO
          EOF
          
          # Chạy XcodeGen để tạo file .xcodeproj
          xcodegen generate
          
          # Tải thư viện ZipArchive
          xcodebuild -resolvePackageDependencies -project ProxyDetal.xcodeproj

          # Build
          xcodebuild clean archive \
            -project ProxyDetal.xcodeproj \
            -scheme ProxyDetal \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $PWD/../../build/App.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="app.entitlements"

      - name: Package to IPA
        run: |
          TARGET_DIR=$(find . -name "App.swift" -exec dirname {} \; | head -n 1)
          
          mkdir -p $PWD/build/Payload
          cp -r $PWD/build/App.xcarchive/Products/Applications/*.app $PWD/build/Payload/
          
          APP_NAME=$(find $PWD/build/Payload -name "*.app" -exec basename {} \; | head -n 1)
          APP_PATH="$PWD/build/Payload/$APP_NAME"
          
          if [ -d "$TARGET_DIR/Patches" ]; then
            cp -r "$TARGET_DIR/Patches" "$APP_PATH/Patches"
          fi
          
          cd $PWD/build
          zip -r 3105-Unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3105-IPA
          path: $PWD/build/3105-Unsigned.ipa
          retention-days: 7
