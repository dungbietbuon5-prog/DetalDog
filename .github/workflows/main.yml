name: Build 3105 IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip Source Code
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Đang giải nén $ZIP_FILE..."
            unzip -q "$ZIP_FILE"
            rm "$ZIP_FILE"
          fi

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          # Chạy XcodeGen ở thư mục gốc
          xcodegen generate
          
          # Tải các thư viện (ZipArchive) trước khi build
          xcodebuild -resolvePackageDependencies -project ProxyDetal.xcodeproj

      - name: Build Archive
        run: |
          xcodebuild clean archive \
            -project ProxyDetal.xcodeproj \
            -scheme ProxyDetal \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $PWD/build/App.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="ThreeOneOSFive/app.entitlements"

      - name: Package to IPA
        run: |
          mkdir -p $PWD/build/Payload
          cp -r $PWD/build/App.xcarchive/Products/Applications/*.app $PWD/build/Payload/
          
          APP_NAME=$(find $PWD/build/Payload -name "*.app" -exec basename {} \; | head -n 1)
          APP_PATH="$PWD/build/Payload/$APP_NAME"
          
          # Nhét thư mục Patches vào bên trong App sau khi build
          if [ -d "ThreeOneOSFive/Patches" ]; then
            echo "Đang nhét thư mục Patches vào App..."
            cp -r "ThreeOneOSFive/Patches" "$APP_PATH/Patches"
          fi
          
          cd $PWD/build
          zip -r 3105-Unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3105-IPA
          path: $PWD/build/3105-Unsigned.ipa
          retention-days: 7
