name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build and Package IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Archive (Auto-detect .xcodeproj path)
        run: |
          echo "Đang tự động tìm file .xcodeproj trong mã nguồn..."
          PROJECT_PATH=$(find . -name "*.xcodeproj" -maxdepth 3 | head -n 1)
          
          if [ -z "$PROJECT_PATH" ]; then
            echo "❌ Lỗi: Không tìm thấy file .xcodeproj nào trong repository!"
            exit 1
          fi
          
          echo "✅ Đã tìm thấy project tại: $PROJECT_PATH"
          
          # Tiến hành build dựa trên đường dẫn tìm được
          xcodebuild -project "$PROJECT_PATH" \
                     -scheme ThreeOneOSFive \
                     -sdk iphoneos \
                     -configuration Release \
                     clean archive -archivePath build/ThreeOneOSFive.xcarchive

      - name: Export IPA
        run: |
          echo "Đang cấu hình ExportOptions và xuất file IPA..."
          mkdir -p build/ExportOptions
          
          cat << EOF > build/ExportOptions/ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>
              <key>compileBitcode</key>
              <false/>
              <key>uploadBitcode</key>
              <false/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
                     -archivePath build/ThreeOneOSFive.xcarchive \
                     -exportPath build/IPA \
                     -exportOptionsPlist build/ExportOptions/ExportOptions.plist

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThreeOneOSFive-IPA
          path: build/IPA/*.ipa
