name: Build iOS App Auto

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer

      - name: Install Xcodeproj Gem
        run: sudo gem install xcodeproj

      - name: Auto-generate Xcode Project
        run: |
          ruby -e '
            require "xcodeproj"
            project = Xcodeproj::Project.new("ThreeOneOSFive.xcodeproj")
            target = project.new_target(:application, "ThreeOneOSFive", :ios, "15.0")
            
            # Tự động add toàn bộ file swift, c, h vào project
            Dir.glob("**/*.{swift,c,h,m,mm}").each do |file|
              target.add_file_references([project.main_group.new_file(file)])
            end
            
            # Cấu hình đường dẫn chuẩn
            target.build_configurations.each do |config|
              config.build_settings["INFOPLIST_FILE"] = "Info.plist"
              config.build_settings["SWIFT_OBJC_BRIDGING_HEADER"] = "ThreeOneOSFive-Bridging-Header.h"
              config.build_settings["CODE_SIGNING_ALLOWED"] = "NO"
              config.build_settings["CODE_SIGNING_REQUIRED"] = "NO"
            end
            project.save
          '

      - name: Build Archive
        run: |
          xcodebuild clean archive \
            -project ThreeOneOSFive.xcodeproj \
            -scheme ThreeOneOSFive \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $PWD/build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package IPA
        run: |
          mkdir -p $PWD/build/Payload
          cp -r $PWD/build/App.xcarchive/Products/Applications/*.app $PWD/build/Payload/
          cd $PWD/build && zip -r App.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: My-IPA
          path: $PWD/build/App.ipa
