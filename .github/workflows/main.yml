name: Build Unsigned IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer

      - name: Auto-detect Project/Workspace
        id: detect
        run: |
          echo "Finding workspace or project..."
          # Tìm file .xcworkspace trước, nếu không có thì tìm .xcodeproj
          WORKSPACE_FILE=$(find . -name "*.xcworkspace" -not -path "*/.*" | head -n 1)
          PROJECT_FILE=$(find . -name "*.xcodeproj" -not -path "*/.*" | head -n 1)
          
          if [ -n "$WORKSPACE_FILE" ]; then
            echo "TARGET_TYPE=workspace" >> $GITHUB_OUTPUT
            echo "TARGET_PATH=$WORKSPACE_FILE" >> $GITHUB_OUTPUT
            SCHEME_NAME=$(basename "$WORKSPACE_FILE" .xcworkspace)
          elif [ -n "$PROJECT_FILE" ]; then
            echo "TARGET_TYPE=project" >> $GITHUB_OUTPUT
            echo "TARGET_PATH=$PROJECT_FILE" >> $GITHUB_OUTPUT
            SCHEME_NAME=$(basename "$PROJECT_FILE" .xcodeproj)
          else
            echo "LỖI: Không tìm thấy file .xcodeproj hoặc .xcworkspace ở BẤT KỲ đâu trong repo!"
            exit 1
          fi
          
          echo "SCHEME_NAME=$SCHEME_NAME" >> $GITHUB_OUTPUT

      - name: Build and Archive App
        run: |
          TARGET_FLAG="-${{ steps.detect.outputs.TARGET_TYPE }}"
          TARGET_PATH="${{ steps.detect.outputs.TARGET_PATH }}"
          SCHEME_NAME="${{ steps.detect.outputs.SCHEME_NAME }}"
          
          echo "Đang build $TARGET_FLAG $TARGET_PATH với scheme $SCHEME_NAME"
          
          xcodebuild clean archive \
            $TARGET_FLAG "$TARGET_PATH" \
            -scheme "$SCHEME_NAME" \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $PWD/build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Package to IPA
        run: |
          mkdir -p $PWD/build/Payload
          cp -r $PWD/build/App.xcarchive/Products/Applications/*.app $PWD/build/Payload/
          cd $PWD/build
          zip -r DetailDog-Unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Unsigned-IPA
          path: $PWD/build/DetailDog-Unsigned.ipa
          retention-days: 7
