name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build and Package IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug - Liệt kê toàn bộ thư mục và tệp
        run: |
          echo "=== Cấu trúc tệp trong repository ==="
          find . -maxdepth 3 -not -path '*/.*'

      - name: Build Archive (Tạm dừng nếu chưa tìm thấy project)
        run: |
          PROJECT_PATH=$(find . -name "*.xcodeproj" -maxdepth 3 | head -n 1)
          
          if [ -z "$PROJECT_PATH" ]; then
            echo "❌ Cảnh báo: Không tìm thấy file .xcodeproj. Hãy kiểm tra lại xem bạn đã push file này lên GitHub chưa (có thể bị vướng .gitignore)."
            exit 1
          fi
          
          xcodebuild -project "$PROJECT_PATH" \
                     -scheme ThreeOneOSFive \
                     -sdk iphoneos \
                     -configuration Release \
                     clean archive -archivePath build/ThreeOneOSFive.xcarchive

      - name: Export IPA
        run: |
          mkdir -p build/ExportOptions
          cat << EOF > build/ExportOptions/ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>
              <key>compileBitcode</key>
              <false/>
              <key>uploadBitcode</key>
              <false/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
                     -archivePath build/ThreeOneOSFive.xcarchive \
                     -exportPath build/IPA \
                     -exportOptionsPlist build/ExportOptions/ExportOptions.plist

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThreeOneOSFive-IPA
          path: build/IPA/*.ipa
