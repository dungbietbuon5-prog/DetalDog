name: ThreeOneOSFive
options:
  bundleIdPrefix: com.threeone
  deploymentTarget:
    iOS: "15.0"
targets:
  ThreeOneOSFive:
    type: application
    platform: iOS
    sources: 
      - path: . 
    settings:
