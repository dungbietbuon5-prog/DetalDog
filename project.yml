name: ProxyDetal
options:
  bundleIdPrefix: com.proxydetal
  deploymentTarget:
    iOS: "15.0"
targets:
  ProxyDetal:
    type: application
    platform: iOS
    sources: 
      - path: .
        excludes:
          - "Patches/**" # Bỏ qua toàn bộ thư mục Patches khi build
    settings:
      base:
        INFOPLIST_FILE: Info.plist
        PRODUCT_NAME: ProxyDetal
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: app.entitlements
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
