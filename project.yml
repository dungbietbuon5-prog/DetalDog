name: ProxyDetal
options:
  bundleIdPrefix: com.proxydetal
  deploymentTarget:
    iOS: "15.0"
packages:
  ZipArchive:
    url: https://github.com/ZipArchive/ZipArchive.git
    from: 2.5.0
targets:
  ProxyDetal:
    type: application
    platform: iOS
    sources: 
      # Quét tất cả file swift, plist, entitlements, assets trong toàn bộ project
      - path: .
        includes:
          - "**/*.swift"
          - "**/*.plist"
          - "**/*.entitlements"
          - "**/*.xcassets"
        excludes:
          - "**/Patches/**" # Bỏ qua thư mục Patches khi build
    dependencies:
      - package: ZipArchive
    settings:
      base:
        PRODUCT_NAME: ProxyDetal
        PRODUCT_BUNDLE_IDENTIFIER: com.proxydetal.app
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: app.entitlements
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
