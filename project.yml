name: ProxyDetal
options:
  bundleIdPrefix: com.proxydetal
  deploymentTarget:
    iOS: "15.0"
packages:
  ZipArchive:
    url: https://github.com/ZipArchive/ZipArchive.git
    from: 2.5.0
targets:
  ProxyDetal:
    type: application
    platform: iOS
    sources: 
      - path: .
        # CHỈ QUÉT CÁC FILE CẦN THIẾT, BỎ QUA FILE RÁC CỦA GIT
        includes:
          - "**/*.swift"
          - "**/*.plist"
          - "**/*.entitlements"
          - "**/*.xcassets"
        excludes:
          - "**/Patches/**"
          - "**/.git/**"
          - "**/.github/**"
    dependencies:
      - package: ZipArchive
    settings:
      base:
        INFOPLIST_FILE: Info.plist
        PRODUCT_NAME: ProxyDetal
        PRODUCT_BUNDLE_IDENTIFIER: com.proxydetal.app
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: app.entitlements
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
